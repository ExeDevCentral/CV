<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6">
        <animate attributeName="stop-color" values="#3b82f6;#8b5cf6;#06b6d4;#3b82f6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#06b6d4;#3b82f6;#8b5cf6" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#3b82f6;#8b5cf6;#06b6d4" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.15; transform: scale(1) translate(0, 0); }
      50% { opacity: 0.3; transform: scale(1.15) translate(-20px, 15px); }
    }
    @keyframes typingText {
      from { stroke-dashoffset: 1000; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(320px); }
    }
    @keyframes badgeGlow {
      0%, 100% { filter: drop-shadow(0 0 6px rgba(59, 130, 246, 0.4)); }
      50% { filter: drop-shadow(0 0 14px rgba(139, 92, 246, 0.7)); }
    }
    .orb1 {
      animation: pulseOrb 10s ease-in-out infinite;
      transform-origin: 750px 80px;
    }
    .orb2 {
      animation: pulseOrb 12s ease-in-out infinite reverse;
      transform-origin: 150px 240px;
    }
    .cursor {
      animation: blink 0.9s infinite;
    }
    .header-badge {
      animation: badgeGlow 4s ease-in-out infinite;
    }
    .title-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 2px;
    }
    .code-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, Monaco, monospace;
    }
    .sans-font {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Background Card -->
  <rect width="896" height="316" x="2" y="2" rx="16" fill="url(#bgGradient)" />
  <rect width="896" height="316" x="2" y="2" rx="16" fill="url(#grid)" />

  <!-- Background Ambient Glow Orbs -->
  <circle class="orb1" cx="750" cy="80" r="140" fill="#3b82f6" opacity="0.18" filter="url(#glow)" />
  <circle class="orb2" cx="120" cy="240" r="120" fill="#8b5cf6" opacity="0.14" filter="url(#glow)" />

  <!-- Animated Border -->
  <rect width="896" height="316" x="2" y="2" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Top Status Pill -->
  <g transform="translate(48, 38)" class="header-badge">
    <rect width="360" height="28" rx="14" fill="rgba(37, 99, 235, 0.12)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" fill="#93c5fd" font-size="11" font-weight="700" letter-spacing="1.2" class="code-font">
      STATUS: RELENTLESS PURSUIT OF EXCELLENCE
    </text>
  </g>

  <!-- Main Name Header -->
  <text x="48" y="118" fill="url(#textGrad)" font-size="40" class="title-font">
    EXEQUIEL ECHEVARRIA
  </text>

  <!-- Role Subtitle -->
  <text x="48" y="152" fill="url(#accentGrad)" font-size="16" font-weight="700" letter-spacing="1.5" class="sans-font">
    FULL STACK ENGINEER &amp; ENTERPRISE SYSTEMS ARCHITECT
  </text>

  <!-- Animated Terminal Line / Code Quote -->
  <g transform="translate(48, 178)">
    <rect width="804" height="46" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
    <text x="16" y="28" fill="#38bdf8" font-size="14" font-weight="700" class="code-font">&gt;</text>
    <text x="32" y="28" fill="#f1f5f9" font-size="13" font-weight="500" class="code-font">
      <tspan fill="#f43f5e">const</tspan> <tspan fill="#60a5fa">mindset</tspan> = <tspan fill="#a78bfa">"Excelencia como estándar. Disciplina y constancia diaria."</tspan>;
    </text>
    <rect x="696" y="14" width="8" height="18" fill="#38bdf8" class="cursor" />
  </g>

  <!-- Bottom Metric & Focus Tags -->
  <g transform="translate(48, 250)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="20" fill="#cbd5e1" font-size="11.5" font-weight="600" class="sans-font">🚀 Enterprise SaaS</text>
    </g>

    <!-- Tag 2 -->
    <g transform="translate(192, 0)">
      <rect width="210" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="20" fill="#cbd5e1" font-size="11.5" font-weight="600" class="sans-font">⚡ C++ &amp; Python Engines</text>
    </g>

    <!-- Tag 3 -->
    <g transform="translate(414, 0)">
      <rect width="200" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="20" fill="#cbd5e1" font-size="11.5" font-weight="600" class="sans-font">🧠 Relational Modeling</text>
    </g>

    <!-- Tag 4 -->
    <g transform="translate(626, 0)">
      <rect width="178" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
      <text x="14" y="20" fill="#38bdf8" font-size="11.5" font-weight="600" class="sans-font">🌐 Cisco Networking</text>
    </g>
  </g>

</svg>
