<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="100%">
  <defs>
    <linearGradient id="osBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d18" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    @keyframes linePulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @keyframes progress {
      0% { width: 0%; }
      100% { width: 100%; }
    }
    .term-font {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .os-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Container -->
  <rect width="876" height="196" x="2" y="2" rx="12" fill="url(#osBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Terminal Top Bar -->
  <rect width="876" height="34" x="2" y="2" rx="12" fill="rgba(255, 255, 255, 0.03)" />
  <circle cx="22" cy="18" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="38" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="54" cy="18" r="5" fill="#10b981" opacity="0.8" />

  <text x="74" y="22" fill="#94a3b8" font-size="11.5" font-weight="600" class="term-font">
    exe-os@core: ~/daily-routine/discipline.sh — [EXECUTION: CONTINUOUS]
  </text>

  <!-- Items -->
  <!-- Line 1 -->
  <g transform="translate(24, 60)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="term-font">[06:00 AM]</text>
    <text x="105" y="0" fill="#a78bfa" font-size="12" font-weight="700" class="term-font">SYSTEM_INIT &gt;&gt;</text>
    <text x="240" y="0" fill="#f1f5f9" font-size="12" class="term-font">Algorithmic Mastery, C++ Core Engines &amp; High-Leverage Architecture</text>
    <circle cx="830" cy="-4" r="4" fill="#10b981" />
  </g>

  <!-- Line 2 -->
  <g transform="translate(24, 94)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="term-font">[10:00 AM]</text>
    <text x="105" y="0" fill="#60a5fa" font-size="12" font-weight="700" class="term-font">DEEP_BUILD &gt;&gt;</text>
    <text x="240" y="0" fill="#f1f5f9" font-size="12" class="term-font">Enterprise Full-Stack SaaS, Next.js/React &amp; High-Concurrency Pipelines</text>
    <circle cx="830" cy="-4" r="4" fill="#10b981" />
  </g>

  <!-- Line 3 -->
  <g transform="translate(24, 128)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="term-font">[04:00 PM]</text>
    <text x="105" y="0" fill="#34d399" font-size="12" font-weight="700" class="term-font">OPTIMIZE   &gt;&gt;</text>
    <text x="240" y="0" fill="#f1f5f9" font-size="12" class="term-font">SQL Relational Indexing, Cisco Networking &amp; Automated AI Workflows</text>
    <circle cx="830" cy="-4" r="4" fill="#10b981" />
  </g>

  <!-- Line 4 -->
  <g transform="translate(24, 162)">
    <text x="0" y="0" fill="#38bdf8" font-size="12" font-weight="700" class="term-font">[09:00 PM]</text>
    <text x="105" y="0" fill="#f43f5e" font-size="12" font-weight="700" class="term-font">COMPOUND   &gt;&gt;</text>
    <text x="240" y="0" fill="#fbbf24" font-size="12" font-weight="600" class="term-font">+1% Knowledge Base Expansion, Code Review &amp; Zero-Excuse Mindset</text>
    <circle cx="830" cy="-4" r="4" fill="#10b981" />
  </g>
</svg>
