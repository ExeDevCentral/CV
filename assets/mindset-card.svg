<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="100%" height="100%">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080c18" />
    </linearGradient>

    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="cardGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(0, 0, 0, 0.4)" />
    </filter>
  </defs>

  <style>
    @keyframes barGlow {
      0%, 100% { filter: drop-shadow(0 0 4px #38bdf8); }
      50% { filter: drop-shadow(0 0 12px #c084fc); }
    }
    .quote-bar {
      animation: barGlow 3s ease-in-out infinite;
    }
    .quote-mark {
      font-family: Georgia, serif;
      opacity: 0.15;
    }
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }
    .author-text {
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
    }
  </style>

  <!-- Card Body -->
  <rect width="876" height="146" x="2" y="2" rx="12" fill="url(#quoteBg)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" filter="url(#cardGlow)" />

  <!-- Animated Glowing Vertical Accent Bar -->
  <rect class="quote-bar" x="20" y="22" width="4" height="106" rx="2" fill="url(#barGrad)" />

  <!-- Giant Subtle Quote Mark in Background -->
  <text x="790" y="95" font-size="110" fill="#60a5fa" class="quote-mark">”</text>

  <!-- Quote Heading / Badge -->
  <text x="44" y="44" fill="#38bdf8" font-size="11" font-weight="800" letter-spacing="1.8" class="author-text">
    // THE RELENTLESS MINDSET • ZERO EXCUSES
  </text>

  <!-- Quote Lines -->
  <text x="44" y="74" fill="#f8fafc" font-size="15" font-weight="600" class="quote-text">
    «El talento sin disciplina obsesiva es solo una promesa vacía.
  </text>
  <text x="44" y="98" fill="#94a3b8" font-size="14.5" font-weight="500" class="quote-text">
    Mi compromiso es construir sistemas indestructibles y ser un 1% mejor cada maldito día.»
  </text>

  <!-- Footer signature -->
  <text x="44" y="124" fill="#64748b" font-size="11" font-weight="600" class="author-text">
    — Exequiel Echevarria <tspan fill="#3b82f6">|</tspan> Execution &gt; Intention
  </text>
</svg>
