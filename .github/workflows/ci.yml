name: Web Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Check package files and HTML
        run: |
          test -f index.html
          node -c generate_pdf.js
          echo "Integrity check passed."
